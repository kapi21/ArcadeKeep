<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="240">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a12"/>
      <stop offset="50%" stop-color="#101524"/>
      <stop offset="100%" stop-color="#0c0f17"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#ffb703"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Frame -->
  <rect width="800" height="240" rx="20" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="796" height="236" rx="18" fill="none" stroke="#252e42" stroke-width="2"/>
  <rect x="2" y="2" width="796" height="236" rx="18" fill="none" stroke="#00e5ff" stroke-width="1.5" opacity="0.4"/>

  <!-- Subtle CRT Scanlines -->
  <line x1="20" y1="40" x2="780" y2="40" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="20" y1="80" x2="780" y2="80" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="20" y1="120" x2="780" y2="120" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="20" y1="160" x2="780" y2="160" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
  <line x1="20" y1="200" x2="780" y2="200" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>

  <!-- Joystick Emblem Icon -->
  <g transform="translate(60, 35)">
    <!-- Base Glow -->
    <circle cx="80" cy="80" r="75" fill="#00e5ff" opacity="0.08" filter="url(#neonGlow)"/>
    <rect width="160" height="160" rx="32" fill="#141824" stroke="#00e5ff" stroke-width="2"/>
    
    <!-- Joystick Base -->
    <path d="M40 105 C40 98 46 94 56 94 L104 94 C114 94 120 98 120 105 L114 135 C114 140 108 144 100 144 L60 144 C52 144 46 140 46 135 Z" fill="#1f273d" stroke="#334155" stroke-width="2.5"/>
    
    <!-- Buttons -->
    <circle cx="98" cy="118" r="7" fill="#ff007f" filter="url(#neonGlow)"/>
    <circle cx="112" cy="112" r="5" fill="#ffb703"/>
    
    <!-- Shaft -->
    <rect x="74" y="55" width="12" height="42" rx="6" fill="#94a3b8"/>
    
    <!-- Ball Top -->
    <circle cx="80" cy="50" r="22" fill="#ef4444" filter="url(#neonGlow)"/>
    <circle cx="74" cy="44" r="6" fill="#ffffff" opacity="0.75"/>
  </g>

  <!-- Typography -->
  <text x="260" y="95" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="url(#textGrad)" letter-spacing="2">ARCADEKEEP</text>
  <text x="262" y="132" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#94a3b8" letter-spacing="3">RETRO GAMING PRESERVATION &amp; COLLECTION SYSTEM</text>

  <!-- Feature Badges -->
  <g transform="translate(262, 160)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="110" height="28" rx="14" fill="#141824" stroke="#00e5ff" stroke-width="1"/>
    <text x="55" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#00e5ff" text-anchor="middle">📷 CÁMARA PWA</text>

    <!-- Badge 2 -->
    <rect x="120" y="0" width="130" height="28" rx="14" fill="#141824" stroke="#10b981" stroke-width="1"/>
    <text x="185" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981" text-anchor="middle">📈 PRICECHARTING</text>

    <!-- Badge 3 -->
    <rect x="260" y="0" width="115" height="28" rx="14" fill="#141824" stroke="#ff007f" stroke-width="1"/>
    <text x="317" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#ff007f" text-anchor="middle">📦 SQLITE LOCAL</text>

    <!-- Badge 4 -->
    <rect x="385" y="0" width="105" height="28" rx="14" fill="#141824" stroke="#8b5cf6" stroke-width="1"/>
    <text x="437" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#8b5cf6" text-anchor="middle">🐧 PROXMOX LXC</text>
  </g>
</svg>
